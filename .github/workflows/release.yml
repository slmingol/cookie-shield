name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for v$VERSION"

      - name: Build ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DIR=$(mktemp -d)
          rsync -a --exclude='.git*' \
                   --exclude='.github/' \
                   --exclude='session.jsonl' \
                   --exclude='CONTEXT.md' \
                   --exclude='README.md' \
                   --exclude='NOTES.md' \
                   --exclude='*.pem' \
                   --exclude='*.crx' \
                   --exclude='build/' \
                   . "$BUILD_DIR/"
          mkdir -p build
          ZIP_NAME="cookie-shield-v${VERSION}.zip"
          (cd "$BUILD_DIR" && zip -r "$GITHUB_WORKSPACE/build/$ZIP_NAME" .)
          echo "Package: $ZIP_NAME ($(du -h build/$ZIP_NAME | cut -f1))"

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build CRX
        env:
          CHROME_EXTENSION_KEY: ${{ secrets.CHROME_EXTENSION_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chrome)

          # Write signing key from secret (base64-encoded PEM)
          if [ -n "$CHROME_EXTENSION_KEY" ]; then
            echo "$CHROME_EXTENSION_KEY" | base64 -d > /tmp/cookie-shield.pem
            KEY_ARG="--pack-extension-key=/tmp/cookie-shield.pem"
          else
            echo "WARNING: CHROME_EXTENSION_KEY secret not set, generating a new key (unsigned release)"
            KEY_ARG=""
          fi

          # Stage extension for packing (excludes dev files)
          PACK_DIR=$(mktemp -d)
          rsync -a --exclude='.git*' \
                   --exclude='.github/' \
                   --exclude='session.jsonl' \
                   --exclude='CONTEXT.md' \
                   --exclude='README.md' \
                   --exclude='NOTES.md' \
                   --exclude='*.pem' \
                   --exclude='*.crx' \
                   --exclude='build/' \
                   . "$PACK_DIR/cookie-shield/"

          "$CHROME" --pack-extension="$PACK_DIR/cookie-shield" $KEY_ARG --no-message-box 2>/dev/null || true

          CRX_SRC="$PACK_DIR/cookie-shield.crx"
          if [ -f "$CRX_SRC" ]; then
            cp "$CRX_SRC" "build/cookie-shield-v${VERSION}.crx"
            echo "CRX: cookie-shield-v${VERSION}.crx ($(du -h build/cookie-shield-v${VERSION}.crx | cut -f1))"
          else
            echo "WARNING: CRX build failed, skipping"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cookie-shield-v${{ steps.version.outputs.version }}
          path: build/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Cookie Shield v${{ steps.version.outputs.version }}
          files: build/*
          body: |
            ## Cookie Shield v${{ steps.version.outputs.version }}

            ### Install options

            **Load unpacked (ZIP)** — recommended for most users
            1. Download `cookie-shield-v${{ steps.version.outputs.version }}.zip` from Assets below and unzip it
            2. Open `chrome://extensions`
            3. Enable **Developer mode** (top right)
            4. Click **Load unpacked** and select the unzipped folder

            **CRX** — drag `cookie-shield-v${{ steps.version.outputs.version }}.crx` onto `chrome://extensions`

            ### What's in this release
            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full feature details.
          draft: false
          prerelease: false

      # Chrome Web Store publish
      # Uncomment and configure after setting these repository secrets:
      #   CHROME_EXTENSION_ID   - The extension ID from the Chrome Web Store dashboard
      #   CHROME_CLIENT_ID      - OAuth2 client ID from Google Cloud Console
      #   CHROME_CLIENT_SECRET  - OAuth2 client secret
      #   CHROME_REFRESH_TOKEN  - Refresh token (see: https://developer.chrome.com/docs/webstore/using-api)
