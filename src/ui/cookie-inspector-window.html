<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cookie Inspector - CookieShield</title>
  <link rel="stylesheet" href="css/main.css?v=2.0">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      overflow: hidden;
    }
    
    .window-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--bg-color) 0%, var(--bg-secondary) 100%);
    }
    
    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
    }
    
    .window-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .window-title img {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 0 8px var(--primary-glow));
    }
    
    .window-title h1 {
      font-size: 18px;
      margin: 0;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .window-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    /* Make tables more spacious */
    .cookie-inspector-table {
      font-size: 13px;
    }
    
    .cookie-inspector-table th,
    .cookie-inspector-table td {
      padding: 12px 20px;
    }
    
    /* Wider filter fields */
    .filter-fields {
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    
    .search-container {
      padding: 25px;
    }
  </style>
</head>
<body>
  <div class="window-container">
    <div class="window-header">
      <div class="window-title">
        <img src="../../img/icon48.png" alt="Logo">
        <h1>Cookie Inspector</h1>
      </div>
    </div>
    
    <div class="window-content">
      <div class="tab-container">
        <div class="tabs">
          <button class="tab-button active" data-tab="search">Cookie Search</button>
          <button class="tab-button" data-tab="activity">Activity Monitor</button>
        </div>
      </div>
      
      <div id="searchTab" class="tab-content active">
        <div class="search-container">
          <div class="filter-fields">
            <div class="input-group">
              <label for="domainFilter">Domain Contains</label>
              <input type="text" id="domainFilter" class="cyber-input" placeholder="e.g., nike.com" />
            </div>

            <div class="input-group">
              <label for="nameFilter">Name Starts With</label>
              <input type="text" id="nameFilter" class="cyber-input" placeholder="e.g., click_id" />
            </div>
            
            <div class="input-group">
              <label for="valueFilter">Value Contains</label>
              <input type="text" id="valueFilter" class="cyber-input" placeholder="xyz..." />
            </div>
          </div>
          
          <div class="button-row">
            <button id="searchBtn" class="btn-unified compact primary">
              <span class="material-icons">search</span>
              <span class="btn-text">Search</span>
            </button>
            <button id="clearBtn" class="btn-unified compact warning">
              <span class="material-icons">delete_sweep</span>
              <span class="btn-text">Clear</span>
            </button>
          </div>
        </div>
        
        <table id="cookieTable" class="cookie-inspector-table">
          <thead>
            <tr>
              <th>Domain</th>
              <th>Name</th>
              <th>Value</th>
              <th>Path</th>
              <th>Expires</th>
            </tr>
          </thead>
          <tbody>
            <!-- Cookies get populated here -->
          </tbody>
        </table>
      </div>
      
      <div id="activityTab" class="tab-content" style="display: none;">
        <div class="activity-header">
          <h3 style="margin: 0 0 10px 0; color: var(--primary-color); font-size: 16px;">Cookie Activity Monitor</h3>
          <div class="button-group">
            <button id="showIgnoreListBtn" class="cyber-button mini">Manage Ignore List</button>
            <button id="clearActivityBtn" class="cyber-button mini secondary">Clear Activity</button>
          </div>
        </div>
        
        <div id="ignoreListPanel" class="ignore-list-panel" style="display: none;">
          <div class="ignore-list-header">
            <h4 style="margin: 0; color: var(--primary-color);">Domain Ignore List</h4>
            <button id="closeIgnoreListBtn" class="close-btn">×</button>
          </div>
          <div class="ignore-list-content">
            <div class="input-group" style="display: flex; gap: 8px;">
              <input type="text" id="ignoreInput" class="cyber-input" placeholder="Enter domain to ignore (e.g., example.com)" />
              <button id="addIgnoreBtn" class="cyber-button mini">Add</button>
            </div>
            <ul id="ignoreList" class="ignore-list">
              <!-- Ignored domains will be populated here -->
            </ul>
          </div>
        </div>
        
        <table id="activityTable" class="cookie-inspector-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Domain</th>
              <th>Name</th>
              <th>Value</th>
            </tr>
          </thead>
          <tbody>
            <!-- Activity entries get populated here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <!-- Cookie Inspector Delete Confirmation Modal -->
  <div id="cookieDeleteDialog" class="modal" style="display: none;">
    <div class="modal-content modal-alert">
      <div class="modal-header modal-header-danger">
        <h3>⚠️ Delete Cookies</h3>
        <span class="close" id="closeCookieDeleteDialog">&times;</span>
      </div>
      <div class="modal-body">
        <p id="cookieDeleteMessage" class="modal-message"></p>
        <p class="modal-note" style="color: var(--text-secondary); margin-top: 12px; line-height: 1.5;">
          <strong>Warning:</strong> You may be deleting app-essential cookies. This could log you out of websites or reset your preferences.
        </p>
        <div class="form-actions">
          <button id="cookieDeleteYesBtn" class="btn-unified warning">
            <span class="material-icons">delete_sweep</span>
            <span class="btn-text">Delete</span>
          </button>
          <button id="cookieDeleteNoBtn" class="btn-unified primary">
            <span class="material-icons">close</span>
            <span class="btn-text">Cancel</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="cookie-inspector.js"></script>
</body>
</html>
